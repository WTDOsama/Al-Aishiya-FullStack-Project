<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة طلبة مدرسة العائشية دير البلح</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
/* CSS مدمج لتسجيل الدخول فقط */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
body { background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-box { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.login-box h1 { text-align: center; color: #0d9488; margin-bottom: 10px; font-size: 22px; }
.login-box p { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
.logo-circle { width: 100px; height: 100px; background: #0d9488; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 4px solid #fbbf24; }
.logo-circle svg { width: 60px; height: 60px; fill: white; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; font-size: 14px; }
.form-group input { width: 100%; padding: 12px 14px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; }
.form-group input:focus { outline: none; border-color: #0d9488; }
.btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #0d9488; color: white; width: 100%; }
.btn-primary:hover { background: #0f766e; }
.alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 15px; font-size: 14px; }
.alert-error { background: #fee2e2; color: #991b1b; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- صفحة تسجيل الدخول المباشرة -->
<div class="login-box">
  <div class="logo-circle">
    <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
  </div>
  <h1>نظام إدارة طلبة مدرسة العائشية</h1>
  <p>دير البلح - تسجيل الدخول</p>
  <div id="login-alert"></div>
  <form id="login-form">
    <div class="form-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="login-email" required placeholder="admin@alaishiya.edu.ps" value="admin@alaishiya.edu.ps">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="login-password" required placeholder="••••••••" value="admin123">
    </div>
    <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
  </form>
  <p style="margin-top:20px;font-size:12px;color:#999;text-align:center;">
    للتجربة: admin@alaishiya.edu.ps / admin123
  </p>
</div>

<script type="module">
import { supabase } from './services/supabase.js';
import { authService } from './services/authService.js';

// التحقق من الجلسة الحالية
const session = await authService.getSession();
if (session) {
  window.location.href = '/app.html';
}

// معالجة تسجيل الدخول
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const btn = e.target.querySelector('button');
  
  btn.disabled = true;
  btn.textContent = 'جارٍ تسجيل الدخول...';
  
  const result = await authService.signIn(email, password);
  
  if (result.success) {
    window.location.href = '/app.html';
  } else {
    const alertDiv = document.getElementById('login-alert');
    alertDiv.innerHTML = `<div class="alert alert-error">${result.message || 'خطأ في تسجيل الدخول'}</div>`;
    btn.disabled = false;
    btn.textContent = 'تسجيل الدخول';
  }
});
</script>

</body>
</html>
